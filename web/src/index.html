<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>English Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Тёмная тема по системной настройке. Выполняется до загрузки приложения, чтобы не было белой вспышки.
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      var apply = function () { document.documentElement.classList.toggle('dark', query.matches); };
      apply();
      query.addEventListener('change', apply);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
