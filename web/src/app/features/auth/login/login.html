<div class="mx-auto w-full max-w-sm sm:pt-6">
  <section hlmCard>
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-xl">Вход</h1>
      <p hlmCardDescription>Продолжите занятия с того места, где остановились.</p>
    </div>

    <div hlmCardContent>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div hlmFieldGroup>
          <div hlmField>
            <label hlmFieldLabel for="email">Email</label>
            <input hlmInput id="email" type="email" formControlName="email" autocomplete="email" inputmode="email" class="h-11" />
            <hlm-field-error>Введите корректный email</hlm-field-error>
          </div>

          <div hlmField>
            <div class="flex items-center">
              <label hlmFieldLabel for="password">Пароль</label>
              <a routerLink="/forgot-password" class="text-muted-foreground hover:text-foreground ms-auto text-sm underline-offset-4 hover:underline">
                Забыли пароль?
              </a>
            </div>
            <input hlmInput id="password" type="password" formControlName="password" autocomplete="current-password" class="h-11" />
            <hlm-field-error>Введите пароль</hlm-field-error>
          </div>

          @if (error(); as message) {
            <app-error-alert [message]="message" />
          }

          <button hlmBtn type="submit" class="h-11 w-full" [disabled]="submitting()">
            @if (submitting()) {
              <hlm-spinner aria-label="Входим" />
            }
            Войти
          </button>
        </div>
      </form>
    </div>

    <div hlmCardFooter class="justify-center text-sm">
      <span class="text-muted-foreground">Нет аккаунта?&nbsp;</span>
      <a routerLink="/register" class="text-primary font-medium underline-offset-4 hover:underline">Зарегистрироваться</a>
    </div>
  </section>
</div>
