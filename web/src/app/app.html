<header class="bg-background/80 sticky top-0 z-10 border-b backdrop-blur">
  <div class="mx-auto flex h-14 w-full max-w-3xl items-center gap-2 px-4">
    <a routerLink="/" class="brand me-auto flex items-center gap-2 font-semibold">
      <span class="bg-primary text-primary-foreground flex size-8 items-center justify-center rounded-xl">
        <ng-icon name="lucideGraduationCap" class="text-lg" />
      </span>
      <span class="max-[430px]:sr-only">English Platform</span>
    </a>

    <nav class="nav flex items-center gap-1">
      @if (auth.isAuthenticated()) {
        <a hlmBtn variant="ghost" size="sm" routerLink="/learn" routerLinkActive="text-primary" aria-label="Занятие">
          <ng-icon name="lucidePlay" />
          <span class="hidden sm:inline">Занятие</span>
        </a>
        <a hlmBtn variant="ghost" size="sm" routerLink="/dictionary" routerLinkActive="text-primary" aria-label="Словарь">
          <ng-icon name="lucideBookOpen" />
          <span class="hidden sm:inline">Словарь</span>
        </a>
        <a hlmBtn variant="ghost" size="sm" routerLink="/stats" routerLinkActive="text-primary" aria-label="Статистика">
          <ng-icon name="lucideChartColumn" />
          <span class="hidden sm:inline">Статистика</span>
        </a>
        @if (auth.isAdmin()) {
          <a hlmBtn variant="ghost" size="sm" routerLink="/admin" routerLinkActive="text-primary" [routerLinkActiveOptions]="adminMatch" aria-label="Админка">
            <ng-icon name="lucideShieldCheck" />
            <span class="hidden sm:inline">Админка</span>
          </a>
        }
        <a hlmBtn variant="ghost" size="sm" routerLink="/profile" routerLinkActive="text-primary" aria-label="Профиль">
          <ng-icon name="lucideUserRound" />
          <span class="hidden sm:inline">Профиль</span>
        </a>
        <button hlmBtn variant="ghost" size="sm" type="button" (click)="logout()" aria-label="Выйти">
          <ng-icon name="lucideLogOut" />
          <span class="hidden sm:inline">Выйти</span>
        </button>
      } @else {
        <a hlmBtn variant="ghost" size="sm" routerLink="/login">Войти</a>
        <a hlmBtn size="sm" routerLink="/register">Регистрация</a>
      }
    </nav>
  </div>
</header>

<main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6">
  <router-outlet />
</main>

<hlm-toaster position="top-center" richColors />
