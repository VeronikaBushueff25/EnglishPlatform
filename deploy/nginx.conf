# Схема для API: если перед nginx стоит HTTPS-прокси (Caddy), берём его X-Forwarded-Proto, иначе свою.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Отдаёт статику Angular и проксирует /api и /health на api.
# upstream через resolver, чтобы nginx не падал, если api ещё не поднялся,
# и чтобы при масштабировании (docker compose up --scale api=3) запросы шли по всем экземплярам.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    # Service worker и манифест всегда проверяются заново, иначе обновление приложения застрянет в кеше браузера.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Файлы сборки с хешем в имени кешируются надолго.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
