# Запуск всего стека: docker compose -f deploy/docker-compose.yml up --build
# С панелью метрик и трассировки: docker compose -f deploy/docker-compose.yml --profile monitoring up --build
# Секреты берутся из deploy/.env (образец: deploy/.env.example). Подробно: docs/deploy.md.
name: english-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: english_platform
      POSTGRES_USER: english_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_platform -d english_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/Host/EnglishPlatform.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=english_platform;Username=english_platform;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Database__MaxPoolSize: ${DB_POOL_SIZE:-30}
      # Прокси перед API: 1 — только nginx; 2 — ещё HTTPS-прокси (Caddy) перед nginx. См. docs/deploy.md.
      ForwardedHeaders__ForwardLimit: ${FORWARD_LIMIT:-1}
      # Метрики и трассировка уходят в панель (профиль monitoring) или в любой OTLP-коллектор; пусто — выключено.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?задайте JWT_SIGNING_KEY в deploy/.env (не короче 32 символов)}
      Identity__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Identity__AdminEmail: ${ADMIN_EMAIL:-}
      Identity__AdminPassword: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Панель .NET Aspire: метрики (запросы, ошибки, ep.answers, ep.users.registered …), трассы и логи.
  # Порт открыт только на сервере (127.0.0.1) — смотреть через SSH-туннель: ssh -L 18888:localhost:18888 сервер
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    profiles: ["monitoring"]
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:18888:18888"
    restart: unless-stopped

volumes:
  postgres-data:
