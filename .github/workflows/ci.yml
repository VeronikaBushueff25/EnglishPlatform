name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EnglishPlatform.slnx
      - name: Build (генерирует openapi/openapi.json)
        run: dotnet build EnglishPlatform.slnx -c Release --no-restore -m:1
      - name: OpenAPI-документ совпадает с закоммиченным
        run: git diff --exit-code -- openapi/
      - name: Unit, architecture and integration tests (Testcontainers использует Docker раннера)
        run: dotnet test --solution EnglishPlatform.slnx -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Клиент API совпадает с OpenAPI-документом
        run: npm run api:check
      - run: npm run test:ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f src/Host/EnglishPlatform.Host/Dockerfile -t english-platform-api .
      - name: Build web image
        run: docker build -f web/Dockerfile -t english-platform-web .
